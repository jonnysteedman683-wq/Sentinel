name: Deploy

# Builds and publishes the production Docker image on every merge to main.
# Image is pushed to the GitHub Container Registry (GHCR) using the built-in
# GITHUB_TOKEN — no external secrets required. Deploying that image to a
# runtime (e.g. Cloud Run) is an optional second step; see the commented
# job at the bottom.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy the freshly-published image to Google Cloud Run.
  #
  # This job is SAFE to leave enabled: it self-skips (and reports success)
  # until the GCP secrets below are configured, so it never fails merges to
  # main. To activate a real deploy, add these repository secrets:
  #   - GCP_WORKLOAD_IDENTITY_PROVIDER  (Workload Identity Federation provider)
  #   - GCP_SERVICE_ACCOUNT             (service account email to impersonate)
  # and optionally the repository variable GCP_REGION (defaults us-central1).
  # The Cloud Run service also needs its own runtime env/secrets (e.g.
  # GEMINI_API_KEY) configured on the service or via --set-secrets.
  deploy-cloud-run:
    name: Deploy to Cloud Run
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Prepare deploy
        id: prep
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GCP_SA" ]; then
            echo "::notice::GCP secrets not configured — skipping Cloud Run deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          # GHCR image names must be lowercase; github.repository may not be.
          echo "image=ghcr.io/${REPO,,}:sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.prep.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        if: steps.prep.outputs.enabled == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: arcane-quantum-brain
          image: ${{ steps.prep.outputs.image }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
