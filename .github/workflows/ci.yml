name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  biome:
    name: Biome (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Fetch base branch
        run: git fetch --no-tags origin main
      # Gate only files changed against main so the existing lint backlog
      # doesn't block, but new/modified code must pass Biome.
      - name: Biome check (changed files)
        run: npx biome ci --changed --since=origin/main

  build:
    name: Build
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    name: Test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  go-test:
    name: Go Test (decision service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-sentinel/go.mod
          cache-dependency-path: go-sentinel/go.sum
      - name: Vet
        working-directory: go-sentinel
        run: go vet ./internal/...
      - name: Test
        working-directory: go-sentinel
        run: go test -race -cover ./internal/...

  docker:
    name: Docker Build
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t arcane-quantum-brain:${{ github.sha }} .
      - name: Verify image starts
        run: |
          docker run -d --name aqb-smoke \
            -e NODE_ENV=production \
            -e GEMINI_API_KEY=test \
            -p 3000:3000 \
            arcane-quantum-brain:${{ github.sha }}
          sleep 5
          docker logs aqb-smoke
          docker stop aqb-smoke
